aid: olaris
name: Olaris
description: 'Olaris, Inc. is a precision-medicine diagnostics company in Framingham,
  Massachusetts, founded in 2014 by Elizabeth O''Day, that combines mass-spectrometry
  and NMR metabolomics with machine learning to turn metabolite signatures into clinical
  biomarkers of response. Its lead product, myOLARIS-KTdx, is a non-invasive urine
  test for surveillance of kidney graft injury in transplant recipients — including
  borderline, subclinical and clinical rejection and polyomavirus-associated nephropathy
  — run in the company''s own CLIA-certified laboratory and distributed through a
  commercial collaboration with Labcorp. Olaris also sells biomarker discovery services
  to biopharma and is advancing a diagnostics pipeline across oncology, solid-organ
  transplant and neurodegeneration. Olaris publishes no public developer program,
  API reference or machine-readable API contract; its only machine-readable surfaces
  are the platform-generated llms.txt and Wix Site MCP endpoint served from its own
  marketing host.'
