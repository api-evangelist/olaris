apis:
- name: Olaris Site MCP
  description: 'Unauthenticated remote Model Context Protocol endpoint served from
    Olaris'' own host at https://www.myolaris.com/_api/mcp. It is the Wix platform
    Site MCP — provisioned by the website platform, not a first-party Olaris product
    API — and a tools/list call returns nine tools scoped to site "Olaris" covering
    business details, site search, Wix REST API documentation lookup, visitor-token
    issuance and generic Wix site API invocation. It exposes only public site content;
    it does not expose myOLARIS test ordering, results, or any laboratory data.'
